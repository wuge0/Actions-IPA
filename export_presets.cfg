; =============================================================
; Godot 4 iOS 导出 preset —— 最小可用版
; 用途：无 Mac 构建 + TrollStore / 越狱设备自装（不做 App Store 签名）
;
; 用法：
;   1) 复制本文件到 Godot 项目根目录（与 project.godot 同级）
;   2) 把 MyGame / com.yourname.mygame 改成你自己的名字
;   3) 在编辑器里打开一次「项目 → 导出」，Godot 会自动补全其余默认字段
;
; ⚠️ 如果项目里已有 export_presets.cfg（比如已有 Windows/Linux preset），
;    不要直接覆盖！把本文件的 [preset.0] 改成 [preset.1]、[preset.2]...
;    追加到已有文件末尾即可。
; =============================================================

[preset.0]

name="iOS"
platform="iOS"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/MyGame.xcodeproj"
encrypt_pck=false
encrypt_directory=false
script_export_mode=0

[preset.0.options]

; 显示名称，同时决定 Xcode scheme 名 —— 必须与 workflow 的 project_name 一致
application/name="MyGame"

; 反写域名，自装不校验唯一性，随便填但要符合格式
application/bundle_identifier="com.yourname.mygame"

; ★ 关键：iOS 15 设备必须 ≥ 15.0；配 Compatibility 渲染器才能跑
application/min_ios_version="15.0"

; 1=仅 iPhone, 2=Universal（iPhone + iPad）
application/targeted_device_family=2

; 只编 arm64，现代设备全是这个架构，可显著缩短编译时间
architectures/arm64=true

; 自装不走 App Store，但 Godot 导出 iOS 时要求该字段非空（否则报 "App Store Team ID not specified"）。
; 填一个占位的 10 位字母数字即可（不影响免签名 TrollStore/越狱安装）；想正式上架时换成你自己的 Team ID。
application/app_store_team_id="ABCDE12345"

; ★ 关键（macOS 导出必填）：导出阶段 Godot 会在 macOS 上对 dylibs 执行 codesign。
;   若留空默认用 "Apple Distribution"，runner 没装 Apple 证书会直接失败。设为 "-" 即 ad-hoc 签名
;   （codesign -f -s -），无需任何证书即可通过；TrollStore/越狱机安装时会重新签名，互不影响。
application/code_sign_identity_debug="-"
application/code_sign_identity_release="-"

; 工程图标（release 导出校验需要）
application/icon="res://icon.svg"

; ★ 关键：只导出 Xcode 工程，不在导出阶段跑 xcodebuild archive/exportArchive。
;   否则 Godot 会在导出期调用 xcodebuild archive，而 runner 上的 iOS 17.5 SDK
;   明确禁止 ad-hoc 签名（"Ad Hoc code signing is not allowed with SDK 'iOS 17.5'"），
;   直接导致导出失败。真正的免签名编译交给 CI 第 7 步（带 CODE_SIGNING_ALLOWED=NO）。
application/export_project_only=true
