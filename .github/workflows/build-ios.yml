# =============================================================
# Godot 4 -> iOS IPA（免签名，供 TrollStore / 越狱设备安装）
# 无需 Apple 开发者账号、无需证书、无需本机 Mac
# 用法：放到仓库的 .github/workflows/build-ios.yml，然后手动触发
# =============================================================
name: Build Godot iOS IPA (unsigned)

on:
  workflow_dispatch:
    inputs:
      godot_version:
        description: 'Godot 版本（需与本地编辑器完全一致）'
        required: true
        default: '4.7.2'
      project_name:
        description: '导出 preset 里填的工程名'
        required: true
        default: 'MyGame'
      min_ios:
        description: '最低 iOS 版本'
        required: true
        default: '15.0'

jobs:
  build:
    # ★ 必须用 macos-15（Xcode 16 / iOS 18 SDK）！
    #   Godot 4.7.2 的导出模板 libgodot.a 用 Xcode 16 / iOS 18 SDK 编译，
    #   引用了 iOS 18 才有的符号（NSProcessPerformanceProfile*、SwiftUICore、
    #   _LocationEssentials 等）。macos-14 只有 Xcode 15.4（iOS 17.5 SDK），
    #   链接会报 "Undefined symbols for architecture arm64" 并致命失败。
    #   注意：部署目标仍可锁 iOS 15.0（Xcode 16 支持），只是 SDK 要新。
    runs-on: macos-15
    timeout-minutes: 60
    # 发版需要 contents 写权限（创建 Release + 上传 asset）
    permissions:
      contents: write

    env:
      GODOT_VERSION: ${{ github.event.inputs.godot_version }}
      PROJECT_NAME: ${{ github.event.inputs.project_name }}
      MIN_IOS: ${{ github.event.inputs.min_ios }}
      # 关闭签名：我们要的是未签名 .app，交给 TrollStore 永久重签
      SIGN_OPTS: >-
        CODE_SIGNING_ALLOWED=NO
        CODE_SIGN_IDENTITY=""
        CODE_SIGNING_REQUIRED=NO
        CODE_SIGN_ENTITLEMENTS=""
        PROVISIONING_PROFILE_SPECIFIER=""
        IPHONEOS_DEPLOYMENT_TARGET=${{ github.event.inputs.min_ios }}

    steps:
      - name: 检出项目
        uses: actions/checkout@v4

      - name: 确认 Xcode 与 iOS SDK
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 下载 Godot 编辑器（macOS 版）
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip
          ls -d Godot*.app
          chmod +x Godot*.app/Contents/MacOS/Godot
          Godot*.app/Contents/MacOS/Godot --headless --version

      - name: 下载并安装导出模板
        run: |
          curl -sSL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          # ★ 关键：Godot 找模板的路径是 export_templates（不是 templates）！
          #   装错目录会导致导出时报 "No export template found"。
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable/"
          ls "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable/"

      - name: 导出 Xcode 工程
        run: |
          mkdir -p build
          Godot*.app/Contents/MacOS/Godot --headless --path "$PWD" \
            --export-release "iOS" "$PWD/build/${PROJECT_NAME}.xcodeproj"
          find build -maxdepth 2 -name "*.xcodeproj"

      - name: 编译为未签名 .app
        run: |
          # pipefail：xcodebuild 失败时必须让整条管道的非零退出码透传出来，
          # 否则 "xcodebuild ... | tail" 的退出码来自 tail(永远成功)，会掩盖链接失败、
          # 把没有 Mach-O 的空壳 .app 当成成功发出去（已踩过坑）。
          set -o pipefail
          cd build
          xcodebuild \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${PROJECT_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath ./DerivedData \
            $SIGN_OPTS \
            ONLY_ACTIVE_ARCH=NO \
            | tail -n 60
          echo "--- 产物 ---"
          find ./DerivedData/Build/Products -maxdepth 2 -name "*.app"

      - name: 打包 IPA（Payload + zip）
        run: |
          cd build
          APP=$(find ./DerivedData/Build/Products -maxdepth 2 -name "*.app" | head -n 1)
          echo "打包: $APP"
          # ★ 硬校验：没有 Mach-O 可执行文件就绝不打包，避免发出无法运行的空壳 IPA。
          BIN="$APP/$PROJECT_NAME"
          if [ ! -f "$BIN" ]; then
            echo "::error::未找到可执行文件 $BIN，说明 xcodebuild 链接失败，终止打包"
            echo "::group::DerivedData 内容"
            find ./DerivedData/Build/Products -maxdepth 3 2>/dev/null || true
            echo "::endgroup::"
            exit 1
          fi
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "${PROJECT_NAME}.ipa" Payload
          ls -lh "${PROJECT_NAME}.ipa"
          echo "== IPA 可执行文件校验 =="
          unzip -l "${PROJECT_NAME}.ipa" | grep -E "Payload/.*\.app/$PROJECT_NAME$|Payload/.*\.app/Frameworks/" || echo "(警告：未检测到 Frameworks/)"

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.project_name }}-ios-ipa
          path: build/${{ github.event.inputs.project_name }}.ipa
          retention-days: 30

      # ★ 自动发版：runner 有正常公网 + 内置 GITHUB_TOKEN，直接把 IPA 挂到 Release。
      #   沙箱（本机）无法下载 artifact（Azure blob 被网络策略拦截），故由 runner 代发。
      - name: 发布 Release（未签名 IPA）
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-${{ github.run_number }}
          name: MyGame iOS IPA (unsigned) · build ${{ github.run_number }}
          body: |
            ## 未签名 iOS IPA —— 供 TrollStore / 越狱设备安装

            - Godot ${{ env.GODOT_VERSION }}
            - 最低 iOS ${{ env.MIN_IOS }}
            - 包名：com.yourname.mygame

            ### 安装方式
            1. iPhone 装好 **TrollStore**（iOS 14–16.6.1 / 17.0）
               或 **越狱 + AppSync Unified**。
            2. 用 TrollStore 打开下面的 `MyGame.ipa` 即可永久安装（无需证书/7 天续签）。

            ### 只更新游戏内容（零 CI 成本）
            日常改游戏逻辑/资源，本地导出 `MyGame.pck` 替换进 IPA 即可，
            无需重跑本流水线。详见仓库 README。
          files: build/${{ github.event.inputs.project_name }}.ipa
          make_latest: true
          prerelease: false
